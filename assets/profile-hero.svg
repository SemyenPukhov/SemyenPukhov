<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Semyen Pukhov — Senior Full-Stack Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0d13"/>
      <stop offset="0.55" stop-color="#11141d"/>
      <stop offset="1" stop-color="#151327"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(985 70) scale(330)">
      <stop stop-color="#8781f2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8781f2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1120 300) scale(300)">
      <stop stop-color="#e3a13c" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e3a13c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="70" y1="120" x2="640" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9c6ff"/>
    </linearGradient>
    <style>
      .name { font: 800 58px 'Segoe UI', system-ui, -apple-system, sans-serif; letter-spacing: -1.5px; }
      .role { font: 700 24px 'Segoe UI', system-ui, -apple-system, sans-serif; letter-spacing: 0.5px; }
      .stack { font: 500 16px 'Segoe UI', system-ui, -apple-system, sans-serif; }
      .code { font: 500 16px 'Cascadia Code', 'SF Mono', Consolas, monospace; }
      .chip { font: 600 13px 'Cascadia Code', 'SF Mono', Consolas, monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .drift { animation: drift 9s ease-in-out infinite alternate; }
      .drift2 { animation: drift 11s ease-in-out infinite alternate-reverse; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-46px, 22px); } }
    </style>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <g class="drift"><rect width="1200" height="340" fill="url(#glowA)"/></g>
  <g class="drift2"><rect width="1200" height="340" fill="url(#glowB)"/></g>

  <!-- dotted grid -->
  <g fill="#ffffff" fill-opacity="0.05">
    <circle cx="60" cy="40" r="1.5"/><circle cx="140" cy="40" r="1.5"/><circle cx="220" cy="40" r="1.5"/><circle cx="300" cy="40" r="1.5"/><circle cx="380" cy="40" r="1.5"/><circle cx="460" cy="40" r="1.5"/><circle cx="540" cy="40" r="1.5"/><circle cx="620" cy="40" r="1.5"/><circle cx="700" cy="40" r="1.5"/><circle cx="780" cy="40" r="1.5"/><circle cx="860" cy="40" r="1.5"/><circle cx="940" cy="40" r="1.5"/><circle cx="1020" cy="40" r="1.5"/><circle cx="1100" cy="40" r="1.5"/><circle cx="1180" cy="40" r="1.5"/>
    <circle cx="60" cy="120" r="1.5"/><circle cx="140" cy="120" r="1.5"/><circle cx="220" cy="120" r="1.5"/><circle cx="300" cy="120" r="1.5"/><circle cx="380" cy="120" r="1.5"/><circle cx="460" cy="120" r="1.5"/><circle cx="540" cy="120" r="1.5"/><circle cx="620" cy="120" r="1.5"/><circle cx="700" cy="120" r="1.5"/><circle cx="780" cy="120" r="1.5"/><circle cx="860" cy="120" r="1.5"/><circle cx="940" cy="120" r="1.5"/><circle cx="1020" cy="120" r="1.5"/><circle cx="1100" cy="120" r="1.5"/><circle cx="1180" cy="120" r="1.5"/>
    <circle cx="60" cy="200" r="1.5"/><circle cx="140" cy="200" r="1.5"/><circle cx="220" cy="200" r="1.5"/><circle cx="300" cy="200" r="1.5"/><circle cx="380" cy="200" r="1.5"/><circle cx="460" cy="200" r="1.5"/><circle cx="540" cy="200" r="1.5"/><circle cx="620" cy="200" r="1.5"/><circle cx="700" cy="200" r="1.5"/><circle cx="780" cy="200" r="1.5"/><circle cx="860" cy="200" r="1.5"/><circle cx="940" cy="200" r="1.5"/><circle cx="1020" cy="200" r="1.5"/><circle cx="1100" cy="200" r="1.5"/><circle cx="1180" cy="200" r="1.5"/>
    <circle cx="60" cy="280" r="1.5"/><circle cx="140" cy="280" r="1.5"/><circle cx="220" cy="280" r="1.5"/><circle cx="300" cy="280" r="1.5"/><circle cx="380" cy="280" r="1.5"/><circle cx="460" cy="280" r="1.5"/><circle cx="540" cy="280" r="1.5"/><circle cx="620" cy="280" r="1.5"/><circle cx="700" cy="280" r="1.5"/><circle cx="780" cy="280" r="1.5"/><circle cx="860" cy="280" r="1.5"/><circle cx="940" cy="280" r="1.5"/><circle cx="1020" cy="280" r="1.5"/><circle cx="1100" cy="280" r="1.5"/><circle cx="1180" cy="280" r="1.5"/>
  </g>

  <!-- identity -->
  <text x="70" y="128" class="name" fill="url(#nameGrad)">Semyen Pukhov</text>
  <text x="72" y="172" class="role" fill="#e3a13c">Senior Full-Stack Engineer</text>
  <text x="72" y="205" class="stack" fill="#9c9aab">7+ years · product engineering from UI to infrastructure · startup &amp; founding experience</text>

  <text x="72" y="252" class="code" fill="#6d6b7c">$</text>
  <text x="90" y="252" class="code" fill="#c9c6ff">ship --end-to-end --performance --cost-aware</text>
  <rect x="490" y="238" width="9" height="18" fill="#e3a13c" class="cursor"/>

  <!-- stack chips -->
  <g class="chip">
    <rect x="70" y="278" rx="14" width="76" height="28" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="108" y="296" fill="#7cc4ff" text-anchor="middle">React</text>
    <rect x="154" y="278" rx="14" width="86" height="28" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="197" y="296" fill="#eceaf0" text-anchor="middle">Next.js</text>
    <rect x="248" y="278" rx="14" width="110" height="28" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="303" y="296" fill="#7cc4ff" text-anchor="middle">TypeScript</text>
    <rect x="366" y="278" rx="14" width="90" height="28" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="411" y="296" fill="#4cc796" text-anchor="middle">Node.js</text>
    <rect x="464" y="278" rx="14" width="88" height="28" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="508" y="296" fill="#e3d24c" text-anchor="middle">Python</text>
    <rect x="560" y="278" rx="14" width="66" height="28" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="593" y="296" fill="#e3a13c" text-anchor="middle">AWS</text>
    <rect x="634" y="278" rx="14" width="118" height="28" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="693" y="296" fill="#7cc4ff" text-anchor="middle">PostgreSQL</text>
    <rect x="760" y="278" rx="14" width="72" height="28" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="796" y="296" fill="#e5737b" text-anchor="middle">Redis</text>
  </g>

  <!-- impact tiles (right) -->
  <g>
    <rect x="880" y="72" rx="12" width="250" height="52" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="900" y="94" class="chip" fill="#e3a13c">~1.5× AWS bill reduction</text>
    <text x="900" y="113" class="chip" fill="#6d6b7c">regions · lambda · cloudfront</text>

    <rect x="880" y="136" rx="12" width="250" height="52" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="900" y="158" class="chip" fill="#4cc796">-$3,000/mo API costs</text>
    <text x="900" y="177" class="chip" fill="#6d6b7c">twitter/x integration</text>

    <rect x="880" y="200" rx="12" width="250" height="52" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="900" y="222" class="chip" fill="#7cc4ff">4s → 1.5s video startup</text>
    <text x="900" y="241" class="chip" fill="#6d6b7c">player · cdn · caching</text>
  </g>
</svg>
