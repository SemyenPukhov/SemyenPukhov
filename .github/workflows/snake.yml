name: generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: SemyenPukhov
          outputs: |
            dist/github-snake.svg?color_snake=#e3a13c&color_dots=#2b2b36,#4f48d6,#8781f2,#e3a13c,#f2b558
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e3a13c
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
